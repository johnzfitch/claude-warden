  <rect class="accent" x="371" y="408" width="2.5" height="54" rx="1.25" fill="#3fb950"/>
  <text class="hook-name" x="386" y="426">tool-error</text>
  <text class="hook-event" fill="#3fb950" x="686" y="426" text-anchor="end">ToolUseFailure</text>
  <text class="hook-desc" x="386" y="448">Error logging with recovery hints</text>
</g>

<!-- ═══════════════════════════════════════════ -->
<!-- LIFECYCLE                                  -->
<!-- ═══════════════════════════════════════════ -->
<g class="cat-group cat-3">
  <text x="24" y="506" class="cat-label" fill="#2ea68f">LIFECYCLE</text>
  <text x="696" y="506" class="cat-count" text-anchor="end">5 hooks</text>
  <line x1="24" y1="514" x2="696" y2="514" stroke="#2ea68f" stroke-opacity="0.25" stroke-width="1"/>
</g>

<!-- session-start -->
<g class="card-group c10">
