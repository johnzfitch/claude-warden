</g>

<!-- subagent-stop -->
<g class="card-group c14">
  <rect class="card" x="20" y="676" width="680" height="66" rx="6"/>
  <rect class="accent" x="21" y="682" width="2.5" height="54" rx="1.25" fill="#2ea68f"/>
  <text class="hook-name" x="36" y="700">subagent-stop</text>
  <text class="hook-event" fill="#2ea68f" x="686" y="700" text-anchor="end">SubagentStop</text>
  <text class="hook-desc" x="36" y="722">Budget reclaim · subagent duration metrics</text>
</g>

<!-- ═══════════════════════════════════════════ -->
<!-- OBSERVATION                                -->
<!-- ═══════════════════════════════════════════ -->
<g class="cat-group cat-4">
  <text x="24" y="780" class="cat-label" fill="#58a6ff">OBSERVATION</text>
  <text x="696" y="780" class="cat-count" text-anchor="end">1 hook</text>
  <line x1="24" y1="788" x2="696" y2="788" stroke="#58a6ff" stroke-opacity="0.25" stroke-width="1"/>
</g>

<!-- statusline.sh -->
<g class="card-group c15">
  <rect class="card" x="20" y="798" width="680" height="66" rx="6"/>
  <rect class="accent" x="21" y="804" width="2.5" height="54" rx="1.25" fill="#58a6ff"/>
