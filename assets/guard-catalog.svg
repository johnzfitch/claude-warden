  <text class="hook-desc" x="36" y="646">Log session stop events with duration</text>
</g>

<!-- subagent-start -->
<g class="card-group c13">
  <rect class="card" x="370" y="600" width="330" height="66" rx="6"/>
  <rect class="accent" x="371" y="606" width="2.5" height="54" rx="1.25" fill="#2ea68f"/>
  <text class="hook-name" x="386" y="624">subagent-start</text>
  <text class="hook-event" fill="#2ea68f" x="686" y="624" text-anchor="end">SubagentStart</text>
