</g>

<!-- stop -->
<g class="card-group c12">
  <rect class="card" x="20" y="600" width="330" height="66" rx="6"/>
  <rect class="accent" x="21" y="606" width="2.5" height="54" rx="1.25" fill="#2ea68f"/>
