  <text class="hook-name" x="36" y="548">session-start</text>
  <text class="hook-event" fill="#2ea68f" x="336" y="548" text-anchor="end">SessionStart</text>
  <text class="hook-desc" x="36" y="570">Init timing · budgets · event markers</text>
</g>

