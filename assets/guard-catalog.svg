  <rect class="card" x="370" y="524" width="330" height="66" rx="6"/>
  <rect class="accent" x="371" y="530" width="2.5" height="54" rx="1.25" fill="#2ea68f"/>
  <text class="hook-name" x="386" y="548">session-end</text>
