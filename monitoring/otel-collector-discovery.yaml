# Discovery-mode OTEL collector config
# Captures ALL native Claude Code OTEL signals to flat files for schema analysis.
# Deliberately omits filelog/warden to isolate native from hook-generated data.
#
# Usage: scripts/discover-otel-schema.sh (or manually via docker run)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  file/metrics:
    path: /data/metrics.jsonl

  file/logs:
    path: /data/logs.jsonl

  file/traces:
    path: /data/traces.jsonl

  debug:
    verbosity: detailed
    sampling_initial: 99999
    sampling_thereafter: 1

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, debug]

  telemetry:
    logs:
      level: "debug"
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8898
